<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Osobisty planer wieloletniej nauki języków, powtórek i podróży." />
  <meta property="og:title" content="Plan językowy — nauka i powtórki" />
  <meta property="og:description" content="Osobisty plan nauki języków, miesięcznych celów, powtórek i podróży." />
  
  <title>Plan językowy — nauka i powtórki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:#0b101c;
  --panel:#121a2b;
  --panel2:#172238;
  --line:#2d3a57;
  --text:#f4f6fb;
  --muted:#9ba8bd;
  --teal:#8bb5cc;
  --blue:#8299c5;
  --orange:#d59a70;
  --green:#83a995;
  --shadow:0 24px 64px rgba(4,8,18,.3),0 10px 34px rgba(38,63,109,.1)
}

* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  min-height:100vh;
  overflow-x:hidden
}
button,input,select {
  font:inherit
}
.ambient {
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.12;
  pointer-events:none
}
.ambient-a {
  background:#4bd9bb;
  top:-220px;
  left:12%
}
.ambient-b {
  background:#6b7dff;
  right:-230px;
  top:28%
}
.topbar {
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(20px,5vw,76px);
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  background:rgba(9,13,25,.84);
  backdrop-filter:blur(20px);
  z-index:20
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:none;
  color:#fff;
  font-family:Manrope,sans-serif;
  font-weight:800;
  font-size:18px;
  cursor:pointer
}
.brand-mark {
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--teal);
  color:#07120f;
  font-size:13px;
  box-shadow:0 8px 25px rgba(98,231,200,.22)
}
.top-actions {
  display:flex;
  align-items:center;
  gap:12px
}
.saved-state {
  font-size:13px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px
}
.saved-state i {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--teal);
  box-shadow:0 0 12px var(--teal)
}
.icon-button {
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  font-size:20px
}
.icon-button:hover {
  color:#fff;
  border-color:#455274
}
main {
  width:min(1180px,calc(100% - 40px));
  margin:0 auto;
  padding:54px 0 80px
}
.eyebrow {
  color:var(--teal);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  font-weight:700
}
.intro {
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);
  gap:56px;
  align-items:end;
  margin-bottom:42px
}
.intro h1,.year-head h1 {
  font-family:Manrope,sans-serif;
  font-size:clamp(38px,5.8vw,72px);
  letter-spacing:-.055em;
  line-height:.98;
  margin:14px 0 20px;
  max-width:780px
}
.intro h1 span {
  color:var(--teal)
}
.intro-copy {
  color:var(--muted);
  font-size:17px;
  line-height:1.7;
  max-width:620px;
  margin:0
}
.now-card {
  background:linear-gradient(145deg,rgba(98,231,200,.15),rgba(131,168,255,.08));
  border:1px solid rgba(98,231,200,.25);
  padding:24px;
  border-radius:22px;
  box-shadow:var(--shadow)
}
.now-card small {
  color:var(--teal);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.12em
}
.now-card h2 {
  font:700 22px Manrope,sans-serif;
  margin:10px 0 8px
}
.now-card p {
  color:var(--muted);
  margin:0 0 18px
}
.primary,.secondary,.back {
  border:0;
  border-radius:13px;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer;
  transition:.2s
}
.primary {
  background:var(--teal);
  color:#07120f
}
.primary:hover {
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(98,231,200,.18)
}
.toolbar {
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}
.toolbar h2 {
  font:700 24px Manrope,sans-serif;
  margin:0
}
.search {
  position:relative;
  width:min(340px,100%)
}
.search input {
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:#fff;
  border-radius:13px;
  padding:12px 15px 12px 40px;
  outline:none
}
.search input:focus {
  border-color:var(--teal)
}
.search:before {
  content:"⌕";
  position:absolute;
  left:15px;
  top:9px;
  color:var(--muted);
  font-size:20px
}
.years {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}
.year-tile {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:17px;
  align-items:center;
  width:100%;
  text-align:left;
  background:rgba(17,23,42,.82);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 20px;
  color:#fff;
  cursor:pointer;
  transition:.22s;
  min-height:102px
}
.year-tile:hover {
  transform:translateY(-2px);
  border-color:#445272;
  background:var(--panel2);
  box-shadow:0 15px 40px rgba(0,0,0,.2)
}
.year-tile.current {
  border-color:rgba(98,231,200,.45);
  background:linear-gradient(110deg,rgba(98,231,200,.11),rgba(17,23,42,.9))
}
.year-num {
  font:800 13px Manrope,sans-serif;
  color:var(--teal);
  background:rgba(98,231,200,.09);
  padding:9px 10px;
  border-radius:11px
}
.flags {
  font-size:20px;
  letter-spacing:2px;
  margin-bottom:5px
}
.tile-main strong {
  font:700 17px Manrope,sans-serif;
  display:block
}
.tile-main small {
  display:block;
  color:var(--muted);
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:410px
}
.arrow {
  color:var(--muted);
  font-size:24px
}
.empty {
  grid-column:1/-1;
  padding:50px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:18px
}
.year-head {
  position:relative;
  margin-bottom:34px
}
.back {
  background:none;
  color:var(--muted);
  border:1px solid var(--line);
  padding:9px 13px
}
.back:hover {
  color:#fff
}
.year-head h1 {
  font-size:clamp(34px,5vw,62px);
  margin-bottom:12px
}
.year-meta {
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
.pill {
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:999px;
  padding:8px 12px;
  color:var(--muted);
  font-size:13px
}
.pill.accent {
  color:var(--teal);
  border-color:rgba(98,231,200,.3)
}
.detail-grid {
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(280px,.7fr);
  gap:20px;
  align-items:start
}
.language-stack {
  display:grid;
  gap:20px
}
.lang-card,.side-card {
  background:rgba(17,23,42,.9);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  box-shadow:var(--shadow)
}
.lang-title {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:16px
}
.lang-title h2 {
  font:700 27px Manrope,sans-serif;
  margin:0
}
.lang-title h2 span {
  margin-right:10px
}
.lang-title p {
  color:var(--muted);
  margin:7px 0 0
}
.progress-ring {
  --p:0;
  display:grid;
  place-items:center;
  width:58px;
  height:58px;
  border-radius:50%;
  background:conic-gradient(var(--teal) calc(var(--p)*1%),#27314b 0);
  position:relative;
  font-weight:700;
  font-size:12px
}
.progress-ring:after {
  content:"";
  position:absolute;
  inset:6px;
  background:var(--panel);
  border-radius:50%
}
.progress-ring b {
  z-index:1
}
.levels {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:22px 0
}
.level {
  border:1px solid var(--line);
  background:#0d1324;
  color:var(--muted);
  border-radius:14px;
  padding:14px 12px;
  text-align:left;
  cursor:pointer;
  position:relative
}
.level strong {
  display:block;
  font:800 19px Manrope,sans-serif;
  color:#fff
}
.level small {
  font-size:11px
}
.level:after {
  content:"○";
  position:absolute;
  right:12px;
  top:13px;
  font-size:18px
}
.level.done:after {
  content:"●"
}
.level.a1.done {
  border-color:var(--green);
  background:rgba(115,217,158,.1)
}
.level.a2.done {
  border-color:var(--blue);
  background:rgba(131,168,255,.1)
}
.level.b1.done {
  border-color:var(--orange);
  background:rgba(255,173,102,.1)
}
.months {
  display:grid;
  gap:8px
}
.month {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:center;
  border-top:1px solid rgba(255,255,255,.07);
  padding:13px 2px
}
.month-check {
  appearance:none;
  width:22px;
  height:22px;
  border:1px solid #485571;
  border-radius:7px;
  cursor:pointer;
  display:grid;
  place-content:center
}
.month-check:checked {
  background:var(--teal);
  border-color:var(--teal)
}
.month-check:checked:after {
  content:"✓";
  color:#07120f;
  font-size:14px;
  font-weight:900
}
.month.done .month-copy {
  opacity:.55
}
.month-copy strong {
  font-size:14px
}
.month-copy p {
  margin:3px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45
}
.target {
  font-size:11px;
  padding:5px 8px;
  border-radius:999px;
  background:#202a43;
  color:var(--muted)
}
.side {
  display:grid;
  gap:20px;
  position:sticky;
  top:94px
}
.side-card h3 {
  font:700 20px Manrope,sans-serif;
  margin:0 0 8px
}
.side-card>p {
  color:var(--muted);
  line-height:1.5;
  margin:0
}
.travel-card {
  background:linear-gradient(145deg,rgba(255,173,102,.14),rgba(17,23,42,.94));
  border-color:rgba(255,173,102,.28)
}
.travel-icon {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:rgba(255,173,102,.14);
  border-radius:13px;
  font-size:22px;
  margin-bottom:15px
}
.travel-list {
  display:grid;
  gap:8px;
  margin-top:16px
}
.travel-row {
  display:flex;
  gap:10px;
  align-items:center;
  color:#e9edf7;
  font-size:14px
}
.travel-row span:first-child {
  color:var(--orange)
}
.review-note {
  font-size:13px!important;
  margin-top:14px!important;
  padding:12px;
  border-radius:12px;
  background:rgba(98,231,200,.08);
  color:#bcefe2!important
}
.week {
  display:grid;
  gap:8px;
  margin-top:16px
}
.session {
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 11px
}
.session strong {
  font-size:13px
}
.session small {
  display:block;
  color:var(--muted);
  margin-top:2px
}
.session select {
  border:0;
  background:#202a43;
  color:#dbe2f1;
  border-radius:8px;
  padding:6px;
  font-size:12px;
  outline:none
}
.review-tags {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:14px
}
.review-tags span {
  font-size:11px;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 8px
}
footer {
  width:min(1180px,calc(100% - 40px));
  margin:0 auto;
  border-top:1px solid rgba(255,255,255,.08);
  padding:28px 0 40px;
  color:#737f97;
  font-size:12px;
  display:flex;
  justify-content:space-between
}
.toast {
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  background:#f2f7f5;
  color:#101610;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:50
}
.toast.show {
  opacity:1;
  transform:translate(-50%,0)
}

@media(max-width:850px) {
  .intro,.detail-grid {
    grid-template-columns:1fr
  }
  .intro {
    gap:24px
  }
  .now-card {
    max-width:520px
  }
  .side {
    position:static
  }
  .years {
    grid-template-columns:1fr
  }
  .saved-state {
    display:none
  }
  .tile-main small {
    max-width:65vw
  }
}

@media(max-width:560px) {
  main {
    width:min(100% - 28px,1180px);
    padding-top:34px
  }
  .topbar {
    padding:0 15px
  }
  .intro h1 {
    font-size:43px
  }
  .toolbar {
    align-items:stretch;
    flex-direction:column
  }
  .search {
    width:100%
  }
  .year-tile {
    padding:15px 14px;
    gap:12px
  }
  .levels {
    gap:6px
  }
  .level {
    padding:11px 8px
  }
  .lang-card,.side-card {
    padding:18px
  }
  .month {
    grid-template-columns:auto 1fr
  }
  .target {
    grid-column:2
  }
  .year-head h1 {
    font-size:36px
  }
  footer {
    flex-direction:column;
    gap:8px
  }
}

@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior:auto!important;
    transition:none!important
  }
}

.rotation-steps {
  display:grid;
  gap:9px;
  margin-top:18px
}
.rotation-steps span {
  display:flex;
  align-items:center;
  gap:10px;
  color:#dce3f1;
  font-size:13px
}
.rotation-steps b {
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:rgba(98,231,200,.11);
  color:var(--teal);
  font-size:11px
}
.review-calendar {
  margin-top:26px;
  padding-top:24px;
  border-top:1px solid var(--line)
}
.calendar-head {
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:end
}
.calendar-head h3 {
  font:700 24px Manrope,sans-serif;
  margin:6px 0 0
}
.pool-count {
  font-size:12px;
  color:var(--teal);
  border:1px solid rgba(98,231,200,.25);
  background:rgba(98,231,200,.07);
  border-radius:999px;
  padding:7px 10px;
  white-space:nowrap
}
.calendar-copy {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:12px 0 16px
}
.week-history {
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px
}
.week-history small {
  color:var(--muted);
  margin-right:3px
}
.week-history span {
  font-size:10px;
  color:var(--green);
  background:rgba(115,217,158,.08);
  border-radius:999px;
  padding:4px 7px
}
.review-week {
  display:grid;
  gap:8px
}
.review-session {
  display:grid;
  grid-template-columns:auto auto 1fr auto;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border:1px solid var(--line);
  background:#0d1324;
  border-radius:13px;
  transition:.18s
}
.review-session.done {
  border-color:rgba(98,231,200,.35);
  background:rgba(98,231,200,.07)
}
.review-check {
  appearance:none;
  width:22px;
  height:22px;
  border:1px solid #485571;
  border-radius:7px;
  cursor:pointer;
  display:grid;
  place-content:center
}
.review-check:checked {
  background:var(--teal);
  border-color:var(--teal)
}
.review-check:checked:after {
  content:"✓";
  color:#07120f;
  font-size:14px;
  font-weight:900
}
.session-flag {
  font-size:21px
}
.session-name strong {
  display:block;
  font-size:13px
}
.session-name small {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px
}
.review-session.done .session-name {
  opacity:.62
}
.review-session select {
  border:0;
  background:#202a43;
  color:#dbe2f1;
  border-radius:8px;
  padding:7px;
  font-size:12px;
  outline:none
}
.calendar-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  color:var(--muted);
  font-size:11px
}
.calendar-footer span {
  display:flex;
  align-items:center;
  gap:7px
}
.calendar-footer i {
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--teal)
}
.calendar-footer strong {
  color:#fff;
  font-size:12px
}

@media(max-width:560px) {
  .calendar-head {
    align-items:start;
    flex-direction:column
  }
  .review-session {
    grid-template-columns:auto auto 1fr
  }
  .review-session select {
    grid-column:2/4;
    width:100%
  }
  .calendar-footer span {
    max-width:75%
  }
}

.current-picker {
  display:grid;
  gap:7px;
  margin:15px 0 12px
}
.current-picker span {
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em
}
.current-picker select {
  width:100%;
  border:1px solid rgba(98,231,200,.25);
  background:#101a2a;
  color:#fff;
  border-radius:11px;
  padding:10px 11px;
  outline:none
}
.current-picker select:focus {
  border-color:var(--teal)
}
.current-badge {
  display:inline-block;
  vertical-align:middle;
  margin-left:8px;
  padding:4px 7px;
  border-radius:999px;
  background:var(--teal);
  color:#07120f;
  font-style:normal;
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase
}
.current-year-button {
  cursor:pointer;
  font-weight:700
}
.current-year-button:hover {
  color:#fff;
  border-color:#53617f
}
.current-year-button.is-current {
  color:#07120f;
  background:var(--teal);
  border-color:var(--teal)
}

.flags {
  display:flex;
  align-items:center;
  gap:6px;
  min-height:22px
}
.flag-img {
  display:inline-block;
  width:30px;
  height:20px;
  object-fit:cover;
  border-radius:4px;
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 4px 12px rgba(0,0,0,.22);
  vertical-align:middle
}
.lang-title h2 .flag-img {
  width:34px;
  height:23px
}
.session-flag {
  display:flex;
  align-items:center
}
.session-flag .flag-img {
  width:28px;
  height:19px
}
.current-badge {
  margin-left:3px
}

.ambient-a {
  background:#6f8fc1;
  opacity:.16
}
.ambient-b {
  background:#c48460;
  opacity:.12
}
.brand-mark,.primary,.current-badge,.current-year-button.is-current {
  background:linear-gradient(135deg,#8bb5cc,#b9a17f);
  color:#0b1220
}
.primary:hover {
  box-shadow:0 10px 28px rgba(92,126,166,.25)
}
.now-card {
  background:linear-gradient(145deg,rgba(91,126,174,.18),rgba(194,125,79,.1));
  border-color:rgba(130,153,197,.35);
  box-shadow:0 24px 60px rgba(39,64,108,.16),0 10px 30px rgba(148,91,55,.08)
}
.year-tile {
  border-color:rgba(99,120,158,.34);
  box-shadow:inset 0 1px rgba(255,255,255,.025)
}
.year-tile:nth-child(3n+1):hover {
  box-shadow:0 16px 40px rgba(54,83,133,.17)
}
.year-tile:nth-child(3n+2):hover {
  box-shadow:0 16px 40px rgba(145,89,55,.13)
}
.year-tile:nth-child(3n):hover {
  box-shadow:0 16px 40px rgba(86,69,129,.13)
}
.year-tile.current {
  border-color:rgba(139,181,204,.55);
  background:linear-gradient(110deg,rgba(84,121,166,.18),rgba(158,100,64,.08),rgba(17,23,42,.92))
}
.lang-card,.side-card {
  border-color:rgba(91,112,151,.38);
  box-shadow:0 24px 64px rgba(26,48,88,.15),0 8px 28px rgba(145,86,50,.055),inset 0 1px rgba(255,255,255,.025)
}
.language-stack .lang-card:nth-child(even) {
  box-shadow:0 24px 64px rgba(131,78,49,.09),0 8px 28px rgba(35,61,103,.12),inset 0 1px rgba(255,255,255,.025)
}
.review-calendar {
  border:1px solid rgba(91,112,151,.32);
  background:linear-gradient(145deg,rgba(36,53,84,.36),rgba(63,42,39,.15));
  border-radius:18px;
  padding:20px;
  margin-top:26px
}
.calendar-head {
  align-items:center
}
.calendar-head h3 em {
  font:700 10px "DM Sans",sans-serif;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#a9c3d3;
  background:rgba(139,181,204,.1);
  border:1px solid rgba(139,181,204,.22);
  border-radius:999px;
  padding:5px 8px;
  margin-left:7px;
  vertical-align:middle
}
.week-nav {
  display:flex;
  gap:7px
}
.week-nav button {
  border:1px solid rgba(107,128,166,.42);
  background:#172238;
  color:#dce4f1;
  border-radius:10px;
  padding:8px 10px;
  font-size:11px;
  font-weight:700;
  cursor:pointer
}
.week-nav button:hover:not(:disabled) {
  border-color:#8299c5;
  background:#1c2942
}
.week-nav button:disabled,.day-stepper button:disabled {
  opacity:.35;
  cursor:not-allowed
}
.pool-line {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:11px;
  margin:14px 0
}
.pool-count {
  color:#a8c1d0;
  border-color:rgba(139,181,204,.3);
  background:rgba(139,181,204,.08)
}
.plan-tuner {
  border:1px solid rgba(190,135,96,.28);
  background:linear-gradient(135deg,rgba(39,55,87,.75),rgba(81,55,47,.32));
  border-radius:15px;
  padding:15px;
  margin-bottom:16px
}
.plan-tuner-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px
}
.plan-tuner h4 {
  font:700 18px Manrope,sans-serif;
  margin:5px 0 0
}
.day-stepper {
  display:grid;
  grid-template-columns:32px 35px 32px;
  align-items:center;
  border:1px solid rgba(130,153,197,.35);
  border-radius:11px;
  overflow:hidden
}
.day-stepper button {
  height:34px;
  border:0;
  background:#1a263d;
  color:#dce5f3;
  font-size:18px;
  cursor:pointer
}
.day-stepper b {
  text-align:center;
  font-size:13px
}
.plan-stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:13px 0
}
.plan-stats span {
  display:grid;
  gap:3px;
  border:1px solid rgba(102,122,159,.28);
  background:rgba(10,16,29,.3);
  border-radius:10px;
  padding:9px;
  color:var(--muted);
  font-size:9px
}
.plan-stats b {
  color:#f2f5fa;
  font-size:13px
}
.plan-impact {
  color:#b9c4d5;
  font-size:11px;
  line-height:1.5;
  margin:0 0 12px
}
.plan-options {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}
.plan-option {
  border:1px solid rgba(100,119,153,.28);
  background:#141e32;
  color:#dce3ef;
  border-radius:10px;
  padding:9px;
  text-align:left;
  cursor:pointer
}
.plan-option strong,.plan-option small {
  display:block
}
.plan-option strong {
  font-size:11px
}
.plan-option small {
  color:var(--muted);
  font-size:9px;
  margin-top:3px
}
.plan-option.selected {
  border-color:#8299c5;
  background:rgba(75,99,140,.25)
}
.plan-option.recommended:not(.selected) {
  border-color:rgba(213,154,112,.34)
}
.review-session {
  border-color:rgba(93,113,149,.32);
  background:rgba(12,19,33,.72)
}
.review-session.done {
  border-color:rgba(131,169,149,.42);
  background:rgba(76,111,94,.12)
}
.travel-reminder {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:start;
  margin:18px 0 4px;
  padding:14px;
  border:1px solid rgba(213,154,112,.42);
  background:linear-gradient(135deg,rgba(116,73,46,.22),rgba(50,65,98,.2));
  border-radius:14px;
  box-shadow:0 10px 30px rgba(139,82,46,.08)
}
.reminder-icon {
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:rgba(213,154,112,.16);
  color:#e0ad88;
  font-size:17px
}
.travel-reminder strong {
  font-size:13px;
  color:#f2e8df
}
.travel-reminder p {
  color:#b9b8ba;
  font-size:11px;
  line-height:1.5;
  margin:4px 0 0
}
.travel-reminder button,.reminder-muted button {
  border:1px solid rgba(213,154,112,.35);
  background:transparent;
  color:#dcb08f;
  border-radius:9px;
  padding:7px 9px;
  font-size:10px;
  font-weight:700;
  cursor:pointer
}
.reminder-muted {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:16px 0 3px;
  padding:10px 12px;
  border:1px dashed rgba(128,146,177,.35);
  border-radius:12px;
  color:var(--muted);
  font-size:11px
}

@media(max-width:650px) {
  .week-nav {
    width:100%
  }
  .week-nav button {
    flex:1
  }
  .pool-line {
    align-items:flex-start;
    flex-direction:column
  }
  .plan-stats {
    grid-template-columns:1fr
  }
  .plan-options {
    grid-template-columns:1fr
  }
  .travel-reminder {
    grid-template-columns:auto 1fr
  }
  .travel-reminder button {
    grid-column:2;
    justify-self:start
  }
  .review-calendar {
    padding:15px
  }
}

.current-goal {
  display:grid;
  grid-template-columns:auto 1fr;
  gap:4px 13px;
  align-items:center;
  margin:18px 0 4px;
  padding:15px 17px;
  border:1px solid rgba(130,153,197,.38);
  border-radius:15px;
  background:linear-gradient(135deg,rgba(58,81,121,.34),rgba(113,72,46,.16));
  box-shadow:inset 0 1px rgba(255,255,255,.035)
}
.current-goal>span {
  grid-row:1/3;
  display:grid;
  place-items:center;
  min-width:76px;
  padding:10px;
  border-radius:11px;
  background:rgba(139,181,204,.13);
  color:#b9cfdd;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em
}
.current-goal strong {
  font:700 16px Manrope,sans-serif;
  color:#f5f0ea
}
.current-goal small {
  color:var(--muted);
  font-size:11px
}
.detailed-months {
  margin-top:2px
}
.month-detail {
  overflow:hidden;
  border:1px solid rgba(91,112,151,.32);
  border-radius:14px;
  background:rgba(12,19,33,.62);
  transition:border-color .18s,background .18s
}
.month-detail.current {
  border-color:rgba(130,153,197,.7);
  background:linear-gradient(135deg,rgba(48,69,106,.5),rgba(77,53,45,.22));
  box-shadow:0 10px 28px rgba(32,54,91,.14)
}
.month-detail.done {
  border-color:rgba(131,169,149,.42);
  background:rgba(68,99,84,.1)
}
.month-detail summary {
  list-style:none;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;
  gap:11px;
  padding:13px;
  cursor:pointer
}
.month-detail summary::-webkit-details-marker {
  display:none
}
.month-detail summary:after {
  content:'⌄';
  color:#7f8ca4;
  font-size:16px;
  transition:transform .18s
}
.month-detail[open] summary:after {
  transform:rotate(180deg)
}
.month-status {
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  border-radius:9px;
  background:#1b2740;
  color:#b8c5d8;
  font:800 12px Manrope,sans-serif
}
.month-detail.done .month-status {
  background:rgba(131,169,149,.2);
  color:#acd0bc
}
.month-summary {
  min-width:0
}
.month-summary strong,.month-summary small {
  display:block
}
.month-summary strong {
  font-size:13px
}
.month-summary small {
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.level-chip {
  padding:5px 7px;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:9px;
  font-weight:800
}
.level-chip.a1 {
  color:#b1cfbf;
  border-color:rgba(131,169,149,.38);
  background:rgba(131,169,149,.08)
}
.level-chip.a2 {
  color:#b6c4e2;
  border-color:rgba(130,153,197,.42);
  background:rgba(130,153,197,.09)
}
.level-chip.b1 {
  color:#e2b99c;
  border-color:rgba(213,154,112,.42);
  background:rgba(213,154,112,.09)
}
.skill-count {
  color:#aeb8ca;
  font-size:10px;
  font-weight:700
}
.skill-list {
  display:grid;
  gap:7px;
  padding:2px 13px 13px 54px
}
.skill-item {
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  align-items:start;
  padding:10px 11px;
  border:1px solid rgba(92,111,146,.27);
  border-radius:11px;
  background:rgba(20,30,50,.72);
  color:#dfe5ef;
  font-size:12px;
  line-height:1.45;
  cursor:pointer
}
.skill-item:hover {
  border-color:rgba(130,153,197,.48)
}
.skill-item.done {
  border-color:rgba(131,169,149,.3);
  background:rgba(71,101,87,.1);
  color:#aebbb5
}
.skill-item input {
  appearance:none;
  width:19px;
  height:19px;
  margin:0;
  border:1px solid #54627b;
  border-radius:6px;
  display:grid;
  place-content:center;
  cursor:pointer
}
.skill-item input:checked {
  border-color:#83a995;
  background:#83a995
}
.skill-item input:checked:after {
  content:'✓';
  color:#0b1510;
  font-size:12px;
  font-weight:900
}
.month-result {
  margin:0 13px 13px 54px;
  padding:9px 11px;
  border-radius:10px;
  background:rgba(213,154,112,.07);
  color:#bca897;
  font-size:10px;
  line-height:1.45
}
.month-result.complete {
  background:rgba(131,169,149,.1);
  color:#a9c9b7
}

@media(max-width:560px) {
  .current-goal {
    grid-template-columns:1fr
  }
  .current-goal>span {
    grid-row:auto;
    justify-self:start
  }
  .month-detail summary {
    grid-template-columns:auto minmax(0,1fr) auto
  }
  .skill-count {
    grid-column:2
  }
  .month-detail summary:after {
    grid-column:3;
    grid-row:2
  }
  .skill-list {
    padding-left:13px
  }
  .month-result {
    margin-left:13px
  }
}

.language-panel {
  padding:0;
  overflow:hidden
}
.language-panel>.lang-title {
  padding:24px;
  align-items:center;
  cursor:pointer;
  list-style:none;
  user-select:none
}
.language-panel>.lang-title::-webkit-details-marker {
  display:none
}
.language-panel>.lang-title:hover {
  background:rgba(130,153,197,.045)
}
.language-panel-body {
  padding:0 24px 24px
}
.language-summary-status {
  display:flex;
  align-items:center;
  gap:12px
}
.panel-caret {
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  border:1px solid rgba(130,153,197,.35);
  border-radius:10px;
  color:#aebbd0;
  background:rgba(130,153,197,.08);
  font-size:18px;
  transition:transform .2s
}
.language-panel[open]>.lang-title .panel-caret {
  transform:rotate(180deg)
}
.language-panel:not([open])>.lang-title {
  padding-bottom:24px
}
.language-panel:not([open]) .lang-title p {
  color:#a9b5c8
}

@media(max-width:560px) {
  .language-panel>.lang-title {
    padding:18px
  }
  .language-panel-body {
    padding:0 18px 18px
  }
  .language-summary-status {
    gap:7px
  }
  .panel-caret {
    width:28px;
    height:28px
  }
  .language-panel .progress-ring {
    width:48px;
    height:48px
  }
}

.review-panel {
  padding:0;
  overflow:hidden
}
.review-panel-summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:20px;
  list-style:none;
  cursor:pointer;
  user-select:none
}
.review-panel-summary::-webkit-details-marker {
  display:none
}
.review-panel-summary:hover {
  background:rgba(130,153,197,.05)
}
.review-panel-summary h3 {
  font:700 20px Manrope,sans-serif;
  margin:6px 0 3px
}
.review-panel-summary small {
  color:var(--muted);
  font-size:11px
}
.review-summary-status {
  display:flex;
  align-items:center;
  gap:10px
}
.review-panel[open]>.review-panel-summary .panel-caret {
  transform:rotate(180deg)
}
.review-panel-body {
  padding:18px 20px 20px;
  border-top:1px solid rgba(91,112,151,.28)
}

@media(max-width:650px) {
  .review-panel-summary {
    padding:15px;
    align-items:flex-start
  }
  .review-summary-status {
    align-items:flex-end;
    flex-direction:column
  }
  .review-panel-body {
    padding:15px
  }
  .review-panel-summary .pool-count {
    font-size:10px
  }
}

.months-panel {
  margin-top:2px;
  border:1px solid rgba(91,112,151,.32);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(28,43,70,.34),rgba(54,40,40,.13));
  overflow:hidden
}
.months-panel-summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px 20px;
  list-style:none;
  cursor:pointer;
  user-select:none
}
.months-panel-summary::-webkit-details-marker {
  display:none
}
.months-panel-summary:hover {
  background:rgba(130,153,197,.05)
}
.months-panel-summary h3 {
  font:700 20px Manrope,sans-serif;
  margin:6px 0 3px
}
.months-panel-summary small {
  color:var(--muted);
  font-size:11px
}
.months-panel[open]>.months-panel-summary .panel-caret {
  transform:rotate(180deg)
}
.months-panel>.detailed-months {
  padding:0 20px 20px;
  border-top:1px solid rgba(91,112,151,.24)
}

@media(max-width:650px) {
  .months-panel-summary {
    padding:15px
  }
  .months-panel>.detailed-months {
    padding:0 15px 15px
  }
}


/* Refined working view */
.saved-state:empty {
  display:none
}
.brand {
  font-size:16px;
  letter-spacing:.01em
}
.brand-mark {
  width:36px;
  height:36px;
  border-radius:11px;
  background:linear-gradient(145deg,#263d63,#9b613c);
  color:#eef3fb;
  font-size:18px;
  box-shadow:0 8px 24px rgba(25,48,85,.32)
}

.practical-intro {
  align-items:center
}
.practical-intro h1 {
  max-width:720px
}
.now-card h2 {
  display:flex;
  align-items:center;
  gap:10px
}
.now-card p {
  line-height:1.55
}

.year-tile.current {
  border:2px solid #6ea4cf;
  background:linear-gradient(115deg,rgba(38,83,123,.48),rgba(122,71,40,.18),rgba(17,23,42,.96));
  box-shadow:0 0 0 3px rgba(64,119,163,.16),0 20px 50px rgba(23,55,96,.25)
}
.year-tile.current .year-num {
  background:#2b6d87;
  color:#f7fbff
}
.current-badge {
  background:linear-gradient(135deg,#79b8d5,#d39a67);
  box-shadow:0 5px 18px rgba(75,131,170,.3);
  font-size:10px
}
.tile-stats {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px
}
.tile-stats small {
  display:inline-block;
  margin:0;
  padding:4px 7px;
  border:1px solid rgba(112,137,178,.3);
  border-radius:999px;
  background:rgba(16,27,47,.62);
  font-size:10px;
  white-space:nowrap
}
.arrow {
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border:1px solid rgba(112,137,178,.35);
  border-radius:11px;
  background:rgba(32,48,77,.7);
  font-size:25px;
  transition:.2s
}
.year-tile:hover .arrow {
  color:#fff;
  border-color:#6e90bd;
  transform:translateX(2px)
}

.back {
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:linear-gradient(145deg,rgba(35,53,83,.86),rgba(25,36,59,.9));
  border-color:rgba(112,137,178,.4);
  box-shadow:0 7px 20px rgba(8,18,35,.16)
}
.back span,.week-nav button span {
  font-size:20px;
  line-height:0
}
.back:hover {
  background:#213250;
  border-color:#7291ba;
  transform:translateY(-1px)
}

.current-year-button.is-current {
  background:linear-gradient(135deg,#3b7b96,#be7b4e);
  color:#fff;
  box-shadow:0 7px 22px rgba(52,102,137,.25)
}

.levels {
  gap:12px
}
.level {
  min-height:106px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border-width:1px;
  border-radius:17px;
  padding:18px 12px;
  color:#dce5ea;
  overflow:hidden;
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 10px 24px rgba(3,10,20,.14);
  transition:transform .2s,border-color .2s,box-shadow .2s
}
.level:hover {
  transform:translateY(-2px)
}
.level strong {
  font-size:23px;
  letter-spacing:.02em
}
.level small {
  font-size:12px;
  margin-top:4px;
  color:rgba(239,246,250,.72)
}
.level:after {
  content:''
}
.level.done:after {
  content:'✓';
  display:grid;
  place-items:center;
  width:22px;
  height:22px;
  right:10px;
  top:9px;
  border-radius:50%;
  background:rgba(6,16,17,.38);
  color:#fff;
  font-size:13px
}
.level.a1 {
  border-color:rgba(55,145,96,.78);
  background:linear-gradient(145deg,#173f31,#102b25)
}
.level.a2 {
  border-color:rgba(66,105,182,.86);
  background:linear-gradient(145deg,#183968,#111f3e)
}
.level.b1 {
  border-color:rgba(211,116,52,.82);
  background:linear-gradient(145deg,#65351d,#3a2119)
}
.level.a1.done {
  border-color:#55c286;
  background:linear-gradient(145deg,#205b42,#15392d);
  box-shadow:0 0 0 2px rgba(59,166,111,.16),0 12px 28px rgba(18,87,57,.2)
}
.level.a2.done {
  border-color:#6797eb;
  background:linear-gradient(145deg,#244f8b,#172b53);
  box-shadow:0 0 0 2px rgba(74,118,196,.18),0 12px 28px rgba(21,53,104,.22)
}
.level.b1.done {
  border-color:#e58d52;

/* Unified chevron icons */
.chevron-icon {
  display:block;
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:0 0 auto
}
.panel-caret {

}

.arrow .chevron-icon {

function reviewCalendar(y,l,languageIndex){const reviews=previousLanguages(y.y,languageIndex),calendarKey=key(y.y,l[0]),week=state.reviewWeeks[calendarKey]||1,selected=Math.max(1,Math.min(7,state.reviewDays[calendarKey]||5)),count=Math.min(selected,reviews.length),start=((week-1)*selected)%reviews.length,sessions=Array.from({length:count},(_,i)=>reviews[(start+i)%reviews.length]),completed=state.completedReviewWeeks[calendarKey]||[],doneCount=sessions.filter(r=>state.reviewDone[reviewDoneKey(calendarKey,week,r.name)]).length;return `<details class="review-calendar review-panel" data-review-panel="${calendarKey}" ${state.reviewCollapsed[calendarKey]?'':'open'}><summary class="review-panel-summary"><div><div class="eyebrow">Powtórki podczas nauki: ${l[0]}</div><h3>Kalendarz powtórek</h3><small>Tydzień ${week} · ${doneCount}/${count} wykonanych sesji</small></div><div class="review-summary-status"><span class="pool-count">${reviews.length} ${reviews.length===1?'język':'języków'} w puli</span><span class="panel-caret" aria-hidden="true">${chevron('down')}</span></div></summary><div class="review-panel-body"><div class="calendar-head"><div><div class="eyebrow">Plan tygodnia</div><h3>Tydzień ${week} ${completed.includes(week)?'<em>ukończony</em>':''}</h3></div><div class="week-nav"><button type="button" data-week-nav="-1" data-calendar="${calendarKey}" ${week===1?'disabled':''}>${chevron('left')} Poprzedni</button><button type="button" data-week-nav="1" data-calendar="${calendarKey}">Następny ${chevron('right')}</button></div></div><div class="pool-line"><span class="pool-count">${reviews.length} ${reviews.length===1?'język':'języków'} w puli</span><span>${count} sesji w tym tygodniu</span></div><details class="pool-details"><summary><span>Pokaż pulę języków</span><span class="panel-caret" aria-hidden="true">${chevron('down')}</span></summary><div class="pool-languages">${reviews.map(r=>`<span>${flagImage(r.flag,r.name)} ${r.name}</span>`).join('')}</div></details>${planP function reviewSession(calendarKey,week,r,i){const doneKey=reviewDoneKey(calendarKey,week,r.name),dayKey=`${doneKey}-day`,d=state.days[dayKey]??days[i%7],done=!!state.reviewDone[doneKey];return `<div class="review-session ${done?'done':''}"><input class="review-check" type="checkbox" data-review="${doneKey}" data-calendar="${calendarKey}" data-week="${week}" aria-label="Odhacz powtórkę języka ${r.name}" ${done?'checked':''}><span class="session-flag">${flagImage(r.flag,r.name)}</span><span class="session-name"><strong>${r.name}</strong><small>${done?'Sesja wykonana':'Do powtórki'}</small></span><select data-day="${dayKey}" aria-label="Dzień powtórki języka ${r.name}">${days.map(x=>`<option ${x===d?'selected':''}>${x}</option>`).join('')}</select></div>`}
